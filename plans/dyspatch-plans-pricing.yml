api_relevant_gating:
  detail: >-
    API Access is available on all three tiers, but "Export via API" and
    "Localizations" are Teams+ only. The Localizations, SMS/Push/Voice/Live
    Activity localization and translation endpoints documented in
    openapi/ are therefore only usable on the Teams+ tier for most accounts.
  api_access_all_tiers: true
  export_via_api_tier: Teams+
  localizations_tier: Teams+
  sla_tier: Teams+
