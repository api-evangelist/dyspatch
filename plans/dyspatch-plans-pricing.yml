note: >-
  Dyspatch publishes a three-tier plan table on its public pricing page with a
  feature-comparison matrix. Two tiers carry a list price; the top tier is quoted
  ("Custom"). Pricing is per-account/seat-band and is not expressed as an API
  call quota — API Access is a feature flag included on every tier rather than a
  metered allowance, and no per-tier API request quota, overage rate, or numeric
  API limit is published anywhere on the pricing page or in the developer docs.
  See rate-limits/dyspatch-rate-limits.yml for what the API does signal at
  runtime. Payment methods accepted: Visa, Mastercard, American Express.
