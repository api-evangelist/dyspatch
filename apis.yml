aid: dyspatch
name: Dyspatch
description: >-
  Dyspatch is an email template management and production platform that lets
  marketing, design, and engineering teams build, collaborate on, approve,
  localize, and publish transactional and marketing messages without hand-coding
  HTML. Content is authored in DML (Dyspatch Markup Language) using a modular,
  no-code drag-and-drop builder with reusable blocks and themes, then published
  to any ESP (Salesforce, HubSpot, Braze, Marketo, and others). Dyspatch also
  covers SMS, push, voice, and Live Activity messages, AMP for Email, and
  large-scale localization across hundreds of languages. The public REST API at
  api.dyspatch.io exposes published templates, drafts with an approval workflow,
  localizations and translations, customer profiles, themes, blocks, and tags,
  and is versioned by date through the Accept header. Dyspatch ships official
  OpenAPI-generated SDKs for six languages, a published MCP server, webhooks, and
  Agent Skills. Dyspatch is backed by Y Combinator.
