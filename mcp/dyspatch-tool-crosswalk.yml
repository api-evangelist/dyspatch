mcp_only_note: >-
  None. Every published Dyspatch MCP tool resolves to at least one public REST
  operation — the MCP server is a strict projection of the REST API, with no
  server-side composites and no capability that exists only through the agent
  surface.
rest_only:
- capability: Read translations
  reason: >-
    The MCP server ships set_translations (write) but no read counterpart, so an
    agent can overwrite a localization's translations without first being able to
    read them through a tool. It must go to the REST API for that.
  operations: [getTranslations, getSMSTranslations, getPushTranslations, getVoiceTranslations,
    getLiveActivityTranslations]
- capability: Read block translations
  reason: Same asymmetry on the block side — set_block_translations exists, the read does not.
  operations: [getBlockTranslations]
- capability: Draft-scoped localization retrieval
  reason: >-
    GET /localizations/{localizationId}/drafts/{draftId} retrieves a
    localization in the context of a specific draft. get_localization is
    documented against the published-localization path only.
  operations: [getDraftLocalizationById, getSMSDraftLocalizationById, getPushDraftLocalizationById,
    getVoiceDraftLocalizationById, getLiveActivityDraftLocalizationById]
- capability: Customer Profiles
  reason: >-
    Advertised on the MCP docs page but absent from the v0.0.10 README tool
    table. See divergences in mcp/dyspatch-mcp.yml.
  operations: [listCustomerProfiles, getCustomerProfileById]
- capability: Themes
  reason: >-
    Advertised on the MCP docs page but absent from the v0.0.10 README tool
    table. render_template does take an optional theme argument, so themes are
    usable indirectly but not enumerable through a tool.
  operations: [listThemes, getThemeById]
