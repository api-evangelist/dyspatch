description: >-
  Binds every tool published by the Dyspatch MCP server (v0.0.10) to the
  OpenAPI operationId(s) that back it, so each tool inherits a real input
  contract instead of a guessed one. Dyspatch's MCP surface collapses the
  channel dimension: one tool takes a `type` parameter (email | sms | push |
  voice | liveactivity) where REST publishes five parallel tag families. That is
  why almost every row fans out 1 -> 5. Confidence is high on those rows because
  the fan-out is mechanical and the operation names are one-to-one by channel.
