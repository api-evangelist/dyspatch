scheme_detail: >-
  API versions use a dated format (YYYY.MM, occasionally with a vN suffix) and
  are selected per request via the Accept header, e.g.
  application/vnd.dyspatch.2026.07+json. Omitting the version pins to the account
  default. Older versions remain retrievable via the changelog version selector.
