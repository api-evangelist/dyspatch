captured_spec_note: >-
  The spec harvested into openapi/ is 2026.06. The 2026.07 delta is additive only
  (a `channel` object on template responses) and changes no operation, so the
  derived artifacts in this repo — data-model, errors, conventions, crosswalk,
  skills, agentic-access — hold for both versions.
entries:
- version: '2026.07'
  date: null
  breaking: false
  additions: true
  highlights:
  - Added a `channel` field (id and name) to template responses across all five
    channel types — Email, SMS, Push, Voice and Live Activity — on both the
    list and get-by-id operations.
  - The field is omitted when no channel is assigned to the template.
  affected_operations: [getTemplates, getTemplateById, getSMSTemplates, getSMSTemplateById,
    getPushTemplates, getPushTemplateById, getVoiceTemplates, getVoiceTemplateById,
    getLiveActivityTemplates, getLiveActivityTemplateById]
- version: '2026.06'
  breaking: false
  highlights:
  - Added query filters (name, folderId, workspaceId) to template endpoints.
  - Added templateId filter to draft endpoints.
  - Introduced translation endpoints for all template types.
  - New Customer Profiles and Themes endpoints.
  - Renamed draft status awaitingTranslation to LOCKED_FOR_TRANSLATION.
- version: '2026.01'
  breaking: false
  highlights:
  - Draft duplicate, archive, and lock/unlock-for-translation endpoints added
    across Email, SMS, Push, Voice, and Live Activity.
- version: '2025.09'
  breaking: true
  highlights:
  - Responses now include a variables key in compiled data for template and
    draft endpoints.
- version: '2025.06'
  breaking: false
  highlights:
  - New Tag management endpoints; tag data included in block, draft, and template
    responses.
- version: '2025.05v2'
  breaking: false
  highlights:
  - Live Activity template and draft endpoints introduced with localization
    support.
- version: '2025.05'
  breaking: false
  highlights:
  - Optional themeId parameter added to template rendering and retrieval
    endpoints.
- version: '2024.12'
  breaking: false
  highlights:
  - Draft approval/rejection endpoints added for Email, SMS, Push, and Voice.
- version: '2024.11'
  breaking: false
  highlights:
  - Push and Voice template/draft endpoints launched with full localization
    support.
- version: '2024.07'
  breaking: false
  highlights:
  - SMS template/draft endpoints introduced; localized template rendering added.
- version: '2019.03'
  breaking: false
  highlights:
  - Initial public release of the Dyspatch API.
