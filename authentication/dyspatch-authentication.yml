  detail: >-
    Single scheme: a static Bearer API key sent in the Authorization header
    (Authorization: Bearer <key>). API keys are created in the Dyspatch admin
    dashboard and come in read-only and read & write permission levels. No OAuth
    2.0, OIDC, or scope surface.
