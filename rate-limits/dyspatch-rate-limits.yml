limit_count: 0
note: >-
  Dyspatch publishes NO numeric rate limit — not a requests-per-second ceiling,
  not a per-plan quota, not a burst allowance. What it does publish is the
  runtime signal, and it publishes it well: every single response definition in
  the OpenAPI (success and error alike) declares an X-RateLimit-Remaining
  response header, and a dedicated 429 "Rate limit exceeded" response is wired
  onto every operation in the spec. An agent can therefore always see how much
  budget is left and can always detect exhaustion; it just cannot know the
  ceiling in advance. limit_count is an honest 0: the headers are documented, the
  numbers are not.
headers:
- name: X-RateLimit-Remaining
  description: The number of requests left for the time window.
  type: integer
  scope: unknown
  present_on: all responses
  evidence: >-
    Declared in components.responses on every shared response object
    (InternalError, InvalidRequest, RateLimited, Unauthenticated, Unauthorized,
    NotFound, Forbidden) in the published OpenAPI 3.0.0 document.
missing_headers:
- X-RateLimit-Limit
- X-RateLimit-Reset
- RateLimit
- RateLimit-Policy
- Retry-After
missing_headers_note: >-
  Neither the RFC 9910 (RateLimit / RateLimit-Policy) family nor the legacy
  X-RateLimit-Limit / X-RateLimit-Reset pair is documented, and no Retry-After is
  declared on the 429. A client that trips the limit is told that it tripped but
  not when it may retry, so back-off has to be guessed.
