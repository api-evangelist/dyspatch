description: >-
  Official Dyspatch API client libraries are OpenAPI-generated and published
  under the getdyspatch GitHub organization. Every entry below carries a
  structured `version` and `published` date read from the registry metadata
  endpoint on 2026-08-13, or an explicit null where the registry has no release.
currency_finding:
  headline: >-
    Dyspatch's REST SDKs are abandoned; its agent surface is not.
  detail: >-
    The newest release of ANY first-party REST client library is 2020-11-13 —
    five years and nine months before this check. The Go module has not been
    released since 2019-06-11 and is still a v2.0.0+incompatible pseudo-module.
    Meanwhile the API itself has shipped nine dated versions since those SDKs
    were cut (2023.01 through 2026.07), adding Customer Profiles, Themes, Tags,
    draft duplicate/archive/lock, translation endpoints and a `channel` field —
    none of which any published SDK knows about. The one package under active
    maintenance is dyspatch-mcp (0.0.10, 2026-06-02), the MCP server. Dyspatch
    is investing in the agent path and letting the language SDKs decay.
  newest_rest_sdk_release: '2020-11-13'
  newest_api_version: '2026.07'
  checked: '2026-08-13'
