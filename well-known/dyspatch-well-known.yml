verdict: no-well-known-surface
verdict_detail: >-
  Every /.well-known/ path probed on every Dyspatch host returns 404. There is no
  RFC 8615 discovery surface here — no security.txt at the canonical location, no
  OIDC discovery, no OAuth authorization-server metadata, no api-catalog, no
  ai-plugin. The one real document Dyspatch does serve, a security.txt, sits at
  the SITE ROOT (https://www.dyspatch.io/security.txt) instead, where no
  RFC 9116 client will look for it. Because of that, this round deliberately does
  NOT carry a `WellKnown` pointer in apis.yml: a file that documents an absence
  must not be scored as a presence. The `SecurityTxt` pointer is retained,
  because a genuine security.txt document is served — just at the wrong path.
