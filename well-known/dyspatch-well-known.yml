      security.txt SHOULD NOT be relied upon. The security@dyspatch.io contact
      it advertises is still the only published disclosure channel Dyspatch has,
      so it is recorded as the disclosure evidence in
      security/dyspatch-vulnerability-disclosure.yml with the staleness flagged.
